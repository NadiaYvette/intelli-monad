name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `tested-with:` in the .cabal files and the
        # README compatibility table. Add a GHC here only after it
        # builds and tests green locally.
        ghc: ['9.8.4', '9.10.3']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.12'

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-cabal
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ env.cache-name }}-
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-
          ${{ runner.os }}-

    - name: Build
      run: |
        cabal update
        cabal build --enable-tests --enable-benchmarks all
    - name: Run tests
      run: cabal test all

  # Advisory: never gates a merge. Signals breakage coming from new
  # compilers/dependency releases early so bounds can be adjusted
  # before they hurt a release.
  head:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: 'latest'
        cabal-version: 'latest'
    - name: Cache
      uses: actions/cache@v4
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-head-${{ github.sha }}
        restore-keys: ${{ runner.os }}-head-
    - name: Build (advisory)
      run: |
        cabal update
        cabal build --enable-tests --enable-benchmarks all
    - name: Test (advisory)
      run: cabal test all

  # Every export carries a doc comment; the 5 TH-generated names are
  # the conventional floor. Advisory: docs must never block a merge.
  haddock:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.4'
        cabal-version: '3.12'
    - name: Cache
      uses: actions/cache@v4
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-haddock-ghc-9.8.4-${{ hashFiles('**/*.cabal') }}
        restore-keys: ${{ runner.os }}-haddock-
    - name: Haddock with hyperlinked source
      run: |
        cabal update
        cabal haddock all --haddock-hyperlink-source --haddock-quickjump
    - name: Verify all three packages rendered
      run: |
        base=dist-newstyle/build/x86_64-linux/ghc-9.8.4
        for p in openai-servant-gen openai-servant-gen-examples intelli-monad; do
          doc="doc/html/$p/index.html"
          test -f "$base/$p/0.1.3.0/$doc" || { echo "missing $p docs"; exit 1; }
        done
        echo "haddock: all three packages rendered"

  # Fully static musl binaries on every tag push. Advisory: a release
  # convenience; a transient docker/network failure must not fail CI.
  static-binary:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Build static binaries (musl, GHC 9.8.4)
      run: |
        docker run --rm -v "$PWD:/src" -w /src benz0li/ghc-musl:9.8.4 \
          bash -c 'cabal update && cabal build \
            intelli-monad:intelli-monad intelli-monad:mcp-serve --with-compiler=ghc'
    - name: Verify static linkage
      run: |
        exe=$(find dist-newstyle -name intelli-monad -type f -executable | head -1)
        srv=$(find dist-newstyle -name mcp-serve -type f -executable | head -1)
        test -n "$exe" && test -n "$srv"
        ldd "$exe" 2>&1 | grep -q "not a dynamic executable"
        ldd "$srv" 2>&1 | grep -q "not a dynamic executable"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: intelli-monad-static-linux-x86_64
        path: |
          dist-newstyle/**/intelli-monad
          dist-newstyle/**/mcp-serve
